<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Cuentos PDF con Animaciones</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería PDF.js para leer el PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Librería PageFlip para el efecto de pasar página -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>
    <div class="header">
        <h1>Lector de Cuentos</h1>
        <p>Sube tu cuento en formato PDF para visualizarlo como un libro real.</p>
        <div class="upload-container">
            <input type="file" id="pdf-upload" accept="application/pdf" />
            <label for="pdf-upload" class="upload-btn">Cargar PDF</label>
        </div>
        
        <!-- Selector de Animaciones -->
        <div class="animation-selector-container">
            <label for="animation-select">Efecto de página:</label>
            <select id="animation-select">
                <option value="flip">1. Volteo 3D (Flipbook)</option>
                <option value="fade">2. Desvanecimiento (Fade)</option>
                <option value="slide">3. Deslizamiento Horizontal</option>
                <option value="zoom">4. Zoom In / Out</option>
                <option value="bounce">5. Rebote 3D</option>
            </select>
        </div>

        <div id="loading">Cargando y procesando páginas (esto puede demorar unos segundos)...</div>
        
        <!-- Declaración de uso de IAG reincorporada -->
        <p class="ai-disclaimer">Este cuento fue creado con asistencia de IAG a través de Gemini, con apoyo en las imágenes y el recurso de navegación que lo contiene.</p>
    </div>

    <!-- Contenedor principal con flechas a los costados -->
    <div class="viewer-wrapper">
        <button id="prev-btn" class="nav-arrow left-arrow" aria-label="Página anterior">&#10094;</button>

        <div class="book-container">
            <!-- El flipbook se generará aquí -->
            <div id="flip-book" class="flip-book"></div>
        </div>

        <button id="next-btn" class="nav-arrow right-arrow" aria-label="Página siguiente">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
