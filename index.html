<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Accessibility & Cuentos PDF</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Librería PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>
    <header class="header" role="banner">
        <h1>Lector de Cuentos</h1>
        
        <!-- Panel Accesible de Herramientas -->
        <div class="toolbar" role="region" aria-label="Herramientas de lectura y accesibilidad">
            <!-- Botones de Navegación -->
            <div class="nav-controls" role="group" aria-label="Navegación de páginas">
                <button id="prev-btn" class="btn" aria-label="Página anterior">
                    ◀ Anterior
                </button>
                <span id="page-num-display" aria-live="polite" aria-label="Página actual">Página 1</span>
                <button id="next-btn" class="btn" aria-label="Página siguiente">
                    Siguiente ▶
                </button>
            </div>

            <!-- Botones de Tamaño de Texto / Zoom -->
            <div class="zoom-controls" role="group" aria-label="Ajuste de tamaño de texto">
                <button id="zoom-out-btn" class="btn" aria-label="Reducir tamaño del texto">
                    A- (Achicar)
                </button>
                <button id="zoom-reset-btn" class="btn" aria-label="Restablecer tamaño original">
                    A (Normal)
                </button>
                <button id="zoom-in-btn" class="btn" aria-label="Aumentar tamaño del texto">
                    A+ (Agrandar)
                </button>
            </div>

            <!-- Lectura en Voz Alta -->
            <div class="audio-controls" role="group" aria-label="Controles de lectura en voz alta">
                <button id="speak-btn" class="btn btn-audio" aria-label="Leer página en voz alta">
                    🔊 Leer en voz alta
                </button>
                <button id="stop-btn" class="btn btn-audio" aria-label="Detener lectura en voz alta">
                    ⏹ Detener
                </button>
            </div>
        </div>

        <div id="loading" role="status" aria-live="polite">Cargando cuento...</div>
    </header>

    <main class="book-container" role="main">
        <!-- El flipbook se generará aquí -->
        <div id="flip-book" class="flip-book" role="region" aria-label="Libro de cuento"></div>
    </main>

    <!-- Región para anuncios del lector de pantalla -->
    <div id="screen-reader-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <script src="script.js"></script>
</body>
</html>
